name: Refresh portfolio website screenshot

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "profile.jpg"
      - "sih-dashboard.jpg"
      - "attendance-manager.jpg"
      - "student-result-system.jpg"
      - "bank-account-system.jpg"
      - "ai-study-assistant.jpg"
      - ".github/workflows/update-portfolio-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture the real portfolio page
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          const { pathToFileURL } = require('url');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1
            });
            await page.goto(pathToFileURL(path.resolve('index.html')).href, {
              waitUntil: 'networkidle',
              timeout: 60000
            }).catch(async () => {
              await page.goto(pathToFileURL(path.resolve('index.html')).href, {
                waitUntil: 'load',
                timeout: 60000
              });
            });
            await page.evaluate(() => document.fonts.ready);
            await page.waitForTimeout(1200);
            await page.screenshot({
              path: 'portfolio-website.jpg',
              type: 'jpeg',
              quality: 88,
              fullPage: false
            });
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit refreshed screenshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh portfolio preview from the actual website"
          file_pattern: portfolio-website.jpg
