name: Refresh portfolio website screenshot

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "profile.jpg"
      - "*.jpg"
      - ".github/workflows/update-portfolio-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

# Prevent two screenshot jobs from committing the same binary image at once.
concurrency:
  group: portfolio-preview-main
  cancel-in-progress: false

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture the real portfolio page
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          const { pathToFileURL } = require('url');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1
            });
            await page.goto(pathToFileURL(path.resolve('index.html')).href, {
              waitUntil: 'networkidle',
              timeout: 60000
            }).catch(async () => {
              await page.goto(pathToFileURL(path.resolve('index.html')).href, {
                waitUntil: 'load',
                timeout: 60000
              });
            });
            await page.evaluate(() => document.fonts.ready);
            await page.waitForTimeout(1200);
            await page.screenshot({
              path: 'portfolio-website.jpg',
              type: 'jpeg',
              quality: 88,
              fullPage: false
            });
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit refreshed screenshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-website.jpg
          if git diff --cached --quiet; then
            echo "Screenshot is already up to date."
            exit 0
          fi
          git commit -m "Refresh portfolio preview from the actual website"
          # Source files may be updated while Chromium is capturing the page.
          git pull --rebase origin main
          git push origin HEAD:main
